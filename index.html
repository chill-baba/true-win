<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://1win.in/">
  <title>Loading 1win.in...</title>
  <style>
    body {
      background-color: #0f1015;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #181a20;
      border: 1px solid #282a36;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 90%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #282a36;
      border-top-color: #0088cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin-bottom: 12px;
      font-size: 1.5rem;
    }
    p {
      color: #8b8d98;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: #0088cc;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #0077b5;
    }
    .note {
      font-size: 0.8rem;
      color: #555866;
      margin-top: 16px;
    }
  </style>
  <script>
    window.location.replace("https://1win.in/");
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to 1win.in...</h2>
    <p>Navigating directly to <strong>https://1win.in</strong></p>
    <a href="https://1win.in/" class="btn">Open 1win.in</a>
    <div class="note">
      *Note: 1win sets <code>X-Frame-Options: SAMEORIGIN</code>, so it must be loaded top-level rather than inside an iframe.
    </div>
  </div>
</body>
</html>
